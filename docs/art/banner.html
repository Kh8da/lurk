<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lurk banner</title>
<style>
  @font-face { font-family: 'Archivo'; src: url('../../renderer/fonts/archivo-latin-standard-normal.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../../renderer/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
  :root { --bg: #09090b; --line: #1d1f25; --line-2: #2a2d35; --text: #f2f3f5; --text-2: #a4a8b2; --text-3: #6b6f7a; --accent: #d4ff3a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: 'Archivo', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }

  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px; opacity: .55;
    -webkit-mask-image: radial-gradient(ellipse 70% 90% at 22% 50%, #000 0%, transparent 75%);
  }

  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .mark { width: 64px; height: 64px; }
  .word { font-weight: 900; font-stretch: 125%; font-size: 128px; line-height: .84; letter-spacing: -.02em; margin: 26px 0 22px; }
  .tag { font-size: 24px; line-height: 1.3; color: var(--text-2); max-width: 540px; white-space: nowrap; }
  .facts { display: flex; gap: 10px; margin-top: 34px; flex-wrap: wrap; }
  .fact {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
    padding: 7px 11px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--text-2);
  }
  .fact b { color: var(--accent); font-weight: 600; }

  .shot {
    position: absolute; left: 640px; top: 92px; width: 900px;
    border-radius: 14px; overflow: hidden; border: 1px solid #2f323a;
    box-shadow: 0 40px 90px -20px rgb(0 0 0 / .9), 0 0 0 8px rgb(255 255 255 / .02);
  }
  .shot img { display: block; width: 100%; }
  .fade { position: absolute; left: 600px; right: 0; bottom: 0; height: 120px; background: linear-gradient(to bottom, transparent, var(--bg)); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="copy">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="23" fill="#d4ff3a" />
      <ellipse cx="45.5" cy="44" rx="9.5" ry="14" fill="#0a0b06" />
      <ellipse cx="69.5" cy="44" rx="9.5" ry="14" fill="#0a0b06" />
      <circle cx="49" cy="39.5" r="3" fill="#d4ff3a" />
      <circle cx="73" cy="39.5" r="3" fill="#d4ff3a" />
    </svg>
    <div class="word">LURK</div>
    <p class="tag">Watches Twitch for you and claims the drops.</p>
    <div class="facts">
      <span class="fact"><b>Free</b> for Windows</span>
      <span class="fact">Autopilot</span>
      <span class="fact">Multiple accounts</span>
    </div>
  </div>
  <div class="shot"><img src="../screens/campaigns.png" alt=""></div>
  <div class="fade"></div>
</body>
</html>
